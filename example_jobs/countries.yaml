# scrapethissite.com — 250 country cards (name, capital, population, area).
# A clean, simple static-HTML target. Demonstrates multi-field rule extraction.

name: countries
description: All countries with capital, population and area

urls:
  - https://www.scrapethissite.com/pages/simple/

mode: http

# Emit one record per .country card; each rule below is matched *within* it.
item_selector: .country

rules:
  - name: name
    selector: .country-name
    transform: strip
  - name: capital
    selector: .country-capital
  - name: population
    selector: .country-population
    transform: int
  - name: area
    selector: .country-area

export:
  formats: [json, csv, terminal]
  output_dir: output/countries
