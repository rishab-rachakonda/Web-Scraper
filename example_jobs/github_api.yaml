name: github_trending
description: Fetch top starred GitHub repositories via the search API

urls:
  - https://api.github.com/search/repositories?q=stars:>10000&sort=stars&order=desc&per_page=30

mode: http

headers:
  Accept: application/vnd.github.v3+json
  X-GitHub-Api-Version: "2022-11-28"

rules:
  - name: full_name
    jsonpath: "items[*].full_name"
  - name: stars
    jsonpath: "items[*].stargazers_count"
  - name: language
    jsonpath: "items[*].language"
  - name: description
    jsonpath: "items[*].description"
  - name: forks
    jsonpath: "items[*].forks_count"
  - name: url
    jsonpath: "items[*].html_url"

rate_limit:
  requests_per_second: 0.5
  delay_between_requests: 2.0

retry:
  max_retries: 2
  retry_on_status: [429, 500, 503]

export:
  formats: [json, csv, terminal]
  output_dir: output/github
