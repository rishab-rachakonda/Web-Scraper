name: quotes
description: Scrape quotes, authors, and tags from quotes.toscrape.com

urls:
  - https://quotes.toscrape.com

mode: http
follow_links: true
link_selector: "li.next a"
max_depth: 10
max_pages: 100

rules:
  - name: text
    selector: span.text
    multiple: true
  - name: author
    selector: small.author
    multiple: true
  - name: tags
    selector: a.tag
    multiple: true

rate_limit:
  requests_per_second: 2.0
  delay_between_requests: 0.5

retry:
  max_retries: 3
  backoff_factor: 2.0

export:
  formats: [json, csv, sqlite, terminal]
  output_dir: output/quotes
